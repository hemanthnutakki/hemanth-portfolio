[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Real routes such as /privacy are handled by the app: serve index.html for any path that is not a real file.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
